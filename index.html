<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Digital Premium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cart-open {
            transform: translateX(0) !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

    <!-- Carrinho Lateral -->
    <div id="cart-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] hidden transition-opacity opacity-0"></div>
    <aside id="side-cart" class="fixed inset-y-0 right-0 z-[70] w-full max-w-md bg-white shadow-2xl translate-x-full transition-transform duration-500 ease-in-out flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
            <h2 class="text-xl font-black flex items-center gap-2">
                <i data-lucide="shopping-cart"></i> O Seu Carrinho
            </h2>
            <button onclick="toggleCart(false)" class="p-2 hover:bg-white rounded-full transition-colors border">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Items inseridos via JS -->
        </div>
        <div class="p-8 border-t bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-500 font-bold uppercase text-xs tracking-widest">Total Estimado</span>
                <span id="cart-total" class="text-3xl font-black text-slate-900">€0.00</span>
            </div>
            <button class="w-full bg-indigo-600 text-white font-black py-5 rounded-3xl shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-[0.98]">
                Finalizar Encomenda
            </button>
        </div>
    </aside>

    <!-- Header -->
    <nav class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-2 group cursor-pointer">
                    <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center text-white">
                        <i data-lucide="zap" fill="currentColor" size="18"></i>
                    </div>
                    <span class="font-black text-lg tracking-tighter uppercase">Vitrine<span class="text-indigo-600">.X</span></span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative hidden md:block group">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" size="16"></i>
                    <input type="text" id="search-input" placeholder="Procurar..." class="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm font-bold focus:bg-white focus:ring-2 focus:ring-indigo-100 outline-none w-48 focus:w-64 transition-all">
                </div>
                <button onclick="toggleCart(true)" class="p-3 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-lg transition-all relative group">
                    <i data-lucide="shopping-cart" class="text-slate-600 group-hover:text-indigo-600"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 w-5 h-5 bg-indigo-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <!-- Banner Hero -->
        <section class="mb-16">
            <div class="h-[400px] rounded-[3rem] overflow-hidden relative bg-slate-900 flex items-center p-12 lg:p-20 group">
                <img src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1200" class="absolute inset-0 w-full h-full object-cover opacity-40 group-hover:scale-105 transition-transform duration-1000">
                <div class="relative z-10 max-w-xl">
                    <span class="px-4 py-1.5 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-full text-[10px] font-black uppercase tracking-widest mb-6 inline-block">Coleção 2025</span>
                    <h1 class="text-5xl lg:text-7xl font-black text-white mb-6 leading-none">Inovação em cada detalhe.</h1>
                    <button class="px-8 py-4 bg-white text-slate-900 font-black rounded-2xl hover:bg-indigo-600 hover:text-white transition-all flex items-center gap-3">
                        Ver Novidades <i data-lucide="arrow-right"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Filtros -->
        <div id="category-filters" class="mb-12 overflow-x-auto no-scrollbar flex items-center gap-3">
            <!-- Injetado via JS -->
        </div>

        <!-- Grid de Produtos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Injetado via JS -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-20 px-6 mt-20 text-center md:text-left">
        <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">
            <div class="col-span-1">
                <div class="flex items-center gap-2 mb-6 justify-center md:justify-start">
                    <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white">
                        <i data-lucide="zap" size="16" fill="currentColor"></i>
                    </div>
                    <span class="font-black text-lg tracking-tighter uppercase">Vitrine<span class="text-indigo-600">.X</span></span>
                </div>
                <p class="text-slate-400 font-medium">Design sofisticado para o amanhã.</p>
            </div>
            <div class="text-slate-300 text-[10px] font-black uppercase tracking-widest flex items-center justify-center md:justify-end col-span-2">
                © 2025 VITRINE.X GLOBAL INC.
            </div>
        </div>
    </footer>

    <script>
        // Dados do Sistema
        const PRODUCTS = [
            { id: 1, name: 'Ténis Ultra Boost Onyx', category: 'Calçado', price: 129.99, image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=600' },
            { id: 2, name: 'Smartwatch V-Pro Black', category: 'Eletrónicos', price: 199.50, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=600' },
            { id: 3, name: 'Mochila Urbana Nomad', category: 'Acessórios', price: 75.00, image: 'https://images.unsplash.com/photo-1553062407-98eeb94c6a62?auto=format&fit=crop&q=80&w=600' },
            { id: 4, name: 'Auscultadores Wireless Hi-Fi', category: 'Eletrónicos', price: 145.00, image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=600' },
            { id: 5, name: 'Óculos de Sol Midnight', category: 'Acessórios', price: 89.00, image: 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?auto=format&fit=crop&q=80&w=600' },
            { id: 6, name: 'Garrafa Térmica Titanium', category: 'Estilo de Vida', price: 34.90, image: 'https://images.unsplash.com/photo-1602143307185-844475455127?auto=format&fit=crop&q=80&w=600' },
        ];

        let cart = [];
        let activeCategory = 'Todos';
        let searchQuery = '';

        // Inicialização
        function init() {
            renderFilters();
            renderProducts();
            lucide.createIcons();
            
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });
        }

        // Renderizar Filtros
        function renderFilters() {
            const container = document.getElementById('category-filters');
            const categories = ['Todos', ...new Set(PRODUCTS.map(p => p.category))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="filter-btn px-8 py-4 rounded-3xl text-sm font-black whitespace-nowrap transition-all flex items-center gap-2 ${activeCategory === cat ? 'bg-slate-900 text-white shadow-xl' : 'bg-white text-slate-400 border border-slate-100'}">
                    <i data-lucide="tag" size="16"></i> ${cat}
                </button>
            `).join('');
            lucide.createIcons();
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderFilters();
            renderProducts();
        }

        // Renderizar Produtos
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = PRODUCTS.filter(p => {
                const matchCat = activeCategory === 'Todos' || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            grid.innerHTML = filtered.map(p => `
                <div class="group bg-white rounded-[3rem] border border-slate-100 overflow-hidden hover:shadow-2xl transition-all duration-500 flex flex-col animate-in">
                    <div class="h-80 relative overflow-hidden bg-slate-50">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    </div>
                    <div class="p-8 flex-1 flex flex-col">
                        <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest block mb-1">${p.category}</span>
                        <h3 class="font-black text-xl text-slate-900 mb-4">${p.name}</h3>
                        <div class="mt-auto flex items-center justify-between border-t pt-6">
                            <span class="text-2xl font-black text-slate-900">€${p.price.toFixed(2)}</span>
                            <button onclick="addToCart(${p.id})" class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center hover:bg-indigo-600 transition-all shadow-lg active:scale-90">
                                <i data-lucide="plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // Gestão do Carrinho
        function toggleCart(open) {
            const side = document.getElementById('side-cart');
            const overlay = document.getElementById('cart-overlay');
            if (open) {
                side.classList.add('cart-open');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                side.classList.remove('cart-open');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 500);
            }
        }

        function addToCart(id) {
            const product = PRODUCTS.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            
            updateCartUI();
            toggleCart(true);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const count = document.getElementById('cart-count');
            const total = document.getElementById('cart-total');
            
            const totalVal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);

            if (totalQty > 0) {
                count.classList.remove('hidden');
                count.innerText = totalQty;
            } else {
                count.classList.add('hidden');
            }

            total.innerText = `€${totalVal.toFixed(2)}`;

            container.innerHTML = cart.length === 0 ? 
                '<p class="text-center text-slate-300 mt-20 font-bold">Carrinho vazio</p>' :
                cart.map(item => `
                    <div class="flex gap-4">
                        <div class="w-16 h-16 rounded-xl overflow-hidden bg-slate-100 shrink-0">
                            <img src="${item.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-indigo-600 font-black text-xs">€${(item.price * item.qty).toFixed(2)}</p>
                            <p class="text-[10px] text-slate-400">Qtd: ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-rose-500"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                `).join('');
            
            lucide.createIcons();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        window.onload = init;
    </script>
</body>
</html>
